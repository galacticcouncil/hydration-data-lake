name: "Reusable :: Build and Deploy to SQD Hosting"

on:
  workflow_call:
    secrets:
      GHCR_AUTH_TOKEN:
        required: true
      SQD_AUTH_TOKEN:
        required: true

jobs:
  extract-indexer-params-from-branch-name:
    name: "Extract tag from branch name"
    runs-on: ubuntu-latest
    outputs:
      indexer_params: ${{ steps.indexer-name-slot-extraction.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: "Get indexer Name and Slot from branch name"
        id: indexer-name-slot-extraction
        uses: actions/github-script@v7
        env:
          GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME
          GITHUB_REF: $GITHUB_REF
          GITHUB_BASE_REF: $GITHUB_BASE_REF
          VERSION_ROOT_FOLDER_NAME: "versions"
        with:
          result-encoding: json
          script: |
            const script = require('./scripts/ci/github-script-src/get-sqd-indexer-name-slot-from-branch-name.js')
            return await script({github, context, core})

      #
      - name: "Echo"
        id: echo
        shell: bash
        env:
          INDEXER_PARAMS: ${{ steps.indexer-name-slot-extraction.outputs.result }}
          INDEXER_NAME: ${{ fromJSON(steps.indexer-name-slot-extraction.outputs.result).indexerName }}
          INDEXER_SLOT: ${{ fromJSON(steps.indexer-name-slot-extraction.outputs.result).indexerSlot }}
        run: |
          echo "Full params: $INDEXER_PARAMS"
          echo "Name: $INDEXER_NAME"
          echo "Slot: $INDEXER_SLOT"

  build-and-deploy-aggregator-indexer:
    name: "Build and Deploy Aggregation indexer"
    runs-on: ubuntu-latest
    needs: extract-indexer-params-from-branch-name
    if: ${{ fromJSON(needs.extract-indexer-params-from-branch-name.indexer_params).indexerName != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install SQD CLI"
        run: npm i -g @subsquid/cli@latest

      - name: "Login to SQD Hosting"
        env:
          SQD_AUTH_TOKEN: ${{ secrets.SQD_AUTH_TOKEN }}
        run: sqd auth -k "$SQD_AUTH_TOKEN"

      - name: "Restore cached Node modules"
        id: cache-node-modules-indexers
        uses: actions/cache@v4
        with:
          path: node_modules
          key: cache-node-modules-indexers-${{ hashFiles('package-lock.json') }}

      - name: "Install Node modules"
        if: steps.cache-node-modules-indexers.outputs.cache-hit != 'true'
        run: npm ci

      - name: "Deploy Aggregation indexer"
        shell: bash
        env:
          INDEXER_NAME: ${{ fromJSON(needs.extract-indexer-params-from-branch-name.result).indexerName }}
          INDEXER_SLOT: ${{ fromJSON(needs.extract-indexer-params-from-branch-name.result).indexerSlot }}
        run: |
          cd indexers/liquidity-pools
          sqd deploy . -m deployment-hydration-indexer.yaml --org galacticcouncil -s "$INDEXER_SLOT" -n "$INDEXER_NAME" --allow-update --allow-manifest-override --no-stream-logs
