name: "Reusable :: Build and Deploy toSQD Hosting"

on:
  workflow_call:
    secrets:
      GHCR_AUTH_TOKEN:
        required: true

jobs:
  extract-image-tag-from-branch-name:
    name: "Extract tag from branch name"
    runs-on: ubuntu-latest
    outputs:
      indexer_params: ${{ steps.indexer-name-slot-extraction.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: "Get indexer Name and Slot from branch name"
        id: indexer-name-slot-extraction
        uses: actions/github-script@v7
        env:
          GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME
          GITHUB_REF: $GITHUB_REF
          GITHUB_BASE_REF: $GITHUB_BASE_REF
          VERSION_ROOT_FOLDER_NAME: "versions"
        with:
          result-encoding: json
          script: |
            const script = require('./scripts/ci/github-script-src/get-sqd-indexer-name-slot-from-branch-name.js')
            return await script({github, context, core})

      #
      - name: "Echo"
        id: echo
        shell: bash
        env:
          INDEXER_PARAMS: ${{ steps.indexer-name-slot-extraction.outputs.result }}
          INDEXER_NAME: ${{ fromJSON(steps.indexer-name-slot-extraction.outputs.result).indexerName }}
          INDEXER_SLOT: ${{ fromJSON(steps.indexer-name-slot-extraction.outputs.result).indexerSlot }}
        run: |
          echo "Full params: $INDEXER_PARAMS"
          echo "Name: $INDEXER_NAME"
          echo "Slot: $INDEXER_SLOT"


