      GQL_PORT: 8080
      NODE_ENV: production
      SUB_PROCESSORS_RANGES: 'lbp_pool__batch_proc_1:3681428:4512000;lbp_pool__batch_proc_2:4512001:5384000;lbp_pool__batch_proc_3:5384001:6256000;lbp_pool__batch_proc_4:6256001:7128000;lbp_pool__batch_proc_5:7128001:-1;lbp_pool__assets_tracker_proc:7128001:-1'
    cmd:
      - sqd
      - api:prod
scale:
  dedicated: false
  addons:
    postgres:
      profile: large
      storage: 200G
  processor:
    profile: large
