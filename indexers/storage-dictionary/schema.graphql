# ======================================================================================================================
# *** Common entities and types ***
# ======================================================================================================================

type SubProcessorStatus @entity {
  "sub_processor_schema_name"
  id: ID!
  fromBlock: Int!
  toBlock: Int!
  height: Int!
  assetsActualisedAtBlock: Int
}

type AccountBalances {
  free: BigInt!
  reserved: BigInt!
  miscFrozen: BigInt
  feeFrozen: BigInt
  frozen: BigInt
  flags: BigInt
}

enum AssetType {
  Bond
  External
  StableSwap
  Token
  XYK
  Erc20
}

type Asset @entity {
  "Asset ID"
  id: ID!
  assetType: AssetType!
  name: String
  symbol: String
  decimals: Int
  xcmRateLimit: BigInt
  isSufficient: Boolean!
  existentialDeposit: BigInt!
}

type HistoricalAssetData @entity {
  "<assetId>-<paraChainBlockHeight>"
  id: ID!
  assetId: Int! @index
  totalIssuance: BigInt!
  existentialDeposit: BigInt!
  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}

# ======================================================================================================================
# *** LBP Pool ***
# ======================================================================================================================

type LbpPool @entity {
  "xykPoolAddress-paraChainBlockHeight"
  id: ID!
  "XYK pool address"
  poolAddress: String! @index
  assetAId: Int! @index
  assetBId: Int! @index
  owner: String!
  start: Int
  end: Int
  initialWeight: Int!
  finalWeight: Int!
  weightCurve: String!
  fee: [Int!]!
  feeCollector: String
  repayTarget: BigInt!
  repayFee: [Int!]!
  maxInRatio: BigInt!
  maxOutRatio: BigInt!
  minPoolLiquidity: BigInt!
  minTradingLimit: BigInt!

  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
  assets: [LbpPoolAssetsData!]! @derivedFrom(field: "pool")
}
type LbpPoolAssetsData @entity {
  "xykPoolAddress-assetId-paraChainBlockHeight"
  id: ID!
  pool: LbpPool!
  assetId: Int! @index
  balances: AccountBalances!
  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}

# ======================================================================================================================
# *** XYK Pool ***
# ======================================================================================================================

type XykPool @entity {
  "xykPoolAddress-paraChainBlockHeight"
  id: ID!
  "XYK pool address"
  poolAddress: String! @index
  assetAId: Int! @index
  assetBId: Int! @index

  exchangeFee: [Int!]
  maxInRatio: BigInt
  maxOutRatio: BigInt
  minPoolLiquidity: BigInt
  minTradingLimit: BigInt
  nativeAssetId: Int
  oracleSource: String

  assets: [XykPoolAssetsData!]! @derivedFrom(field: "pool")

  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}
type XykPoolAssetsData @entity {
  "xykPoolAddress-assetId-paraChainBlockHeight"
  id: ID!
  pool: XykPool!
  assetId: Int! @index
  balances: AccountBalances!
  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}

# ======================================================================================================================
# *** Omnipool ***
# ======================================================================================================================

type Tradability {
  bits: Int!
}

type OmnipoolAssetState {
  hubReserve: BigInt!
  shares: BigInt!
  protocolShares: BigInt!
  cap: BigInt!
  tradable: Tradability
}

type Omnipool @entity {
  "omnipoolId-paraChainBlockHeight"
  id: ID!
  poolAddress: String! @index
  maxInRatio: BigInt!
  maxOutRatio: BigInt!
  minTradingLimit: BigInt!
  minPoolLiquidity: BigInt!
  minWithdrawalFee: BigInt!
  burnProtocolFee: Int!
  hdxAssetId: Int!
  hubAssetId: Int!

  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
  assets: [OmnipoolAssetData!]! @derivedFrom(field: "pool")
}

type OmnipoolAssetData @entity {
  "omnipooAddress-assetId-paraChainBlockHeight"
  id: ID!
  pool: Omnipool!
  assetId: Int! @index
  balances: AccountBalances!
  assetState: OmnipoolAssetState!
  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}

# ======================================================================================================================
# *** Stablepool ***
# ======================================================================================================================

type Stablepool @entity {
  "stablepoolId-paraChainBlockHeight"
  id: ID!
  poolId: Int! @index
  poolAddress: String! @index

  initialAmplification: Int!
  finalAmplification: Int!
  initialBlock: Int!
  finalBlock: Int!
  fee: Int!
  maxInRatio: BigInt!
  maxOutRatio: BigInt!
  minTradingLimit: BigInt!
  amplificationRange: [Int!]!
  minPoolLiquidity: BigInt!

  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
  assets: [StablepoolAssetData!]! @derivedFrom(field: "pool")
}

type StablepoolAssetData @entity {
  "stablepoolId-assetId-paraChainBlockHeight"
  id: ID!
  pool: Stablepool!
  assetId: Int!
  tradable: Tradability
  peg: [String!]!
  balances: AccountBalances!
  paraChainBlockHeight: Int! @index
  relayChainBlockHeight: Int! @index
}
