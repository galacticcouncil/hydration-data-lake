# =================================================
# ============ GENERIC HISTORICAL DATA ============
# =================================================

manifestVersion: subsquid.io/v0.1
name: hydration-storage-dictionary
slot: 605
description: Hydration storage dictionary for generic data (AssetData, Oracles, AavePools)
build:
deploy:
  addons:
    postgres:
      config:
        statement_timeout: 2080000
        log_min_duration_statement: 60000
  processor:

    - name: batch-proc-8
      cmd: ['sqd', 'process:prod']
      env:
        RPC_URL: wss://node-subwhale.kril.hydration.cloud
        RPC_URL_HTTPS: https://node-subwhale.kril.hydration.cloud
        GATEWAY_HYDRATION_HTTPS: https://v2.archive.subsquid.io/network/hydradx
        PROCESS_LBP_POOLS: false
        PROCESS_XYK_POOLS: false
        PROCESS_OMNIPOOLS: false
        PROCESS_STABLEPOOLS: false
        PROCESS_GENERIC_HIST_DATA: true
        PROCESS_ACCOUNTS: false
        INDEXING_IS_PAUSED: false
        PROCESS_ONLY_MISSED_BLOCKS: false
        GQL_PORT: 8080
        NODE_ENV: production
        OMNIPOOL_ADDRESS: '0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000'
        PROCESS_FROM_BLOCK: 11616000
        PROCESS_TO_BLOCK: -1
        STATE_SCHEMA_NAME: gen_hist_data__batch_proc_8
        SUB_BATCH_SIZE: 300
        INDEXER_MAX_SUB_BATCH_SIZE: 4000
        ASSETS_TRACKER_PROCESSOR: true
        PERSIST_HIST_DATA_ONLY_ON_CHANGE: true
        ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: gen_hist_data__batch_proc_8
  api:
    env:
      GQL_PORT: 8080
      NODE_ENV: production
      SUB_PROCESSORS_RANGES: 'gen_hist_data__batch_proc_1:1439857:2752000;gen_hist_data__batch_proc_2:2752001:4064000;gen_hist_data__batch_proc_3:4064001:5376000;gen_hist_data__batch_proc_4:5376001:6688000;gen_hist_data__batch_proc_5:6688001:-1'
    cmd:
      - sqd
      - api:prod

scale:
  dedicated: false
  addons:
    postgres:
      profile: medium
      storage: 10G
  processor:
    profile: medium
  api:
    profile: medium
