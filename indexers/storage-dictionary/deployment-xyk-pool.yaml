# =============================================
# ============== X Y K   P O O L ==============
# =============================================

manifestVersion: subsquid.io/v0.1
name: hydration-storage-dictionary
slot: 213
description: Hydration storage dictionary for XYK pool storage
build:
deploy:
  addons:
    postgres:
      config:
        statement_timeout: 2080000
        log_min_duration_statement: 60000
  processor:
    - name: xyk-pool-batch-proc-5
      cmd: ['sqd', 'process:prod']
      env:
        RPC_URL: wss://node-dir.kril.hydration.cloud
        RPC_URL_HTTPS: https://node-dir.kril.hydration.cloud
        GATEWAY_HYDRATION_HTTPS: https://v2.archive.subsquid.io/network/hydradx
        PROCESS_LBP_POOLS: false
        PROCESS_XYK_POOLS: true
        PROCESS_OMNIPOOLS: false
        PROCESS_STABLEPOOLS: false
        PROCESS_GENERIC_HIST_DATA: false
        PROCESS_ACCOUNTS: false
        INDEXING_IS_PAUSED: false
        PROCESS_ONLY_MISSED_BLOCKS: false
        GQL_PORT: 8080
        NODE_ENV: production
        OMNIPOOL_ADDRESS: '0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000'
        PROCESS_FROM_BLOCK: 11500000
        PROCESS_TO_BLOCK: -1
        STATE_SCHEMA_NAME: xyk_pool__batch_proc_5
        INDEXER_MAX_SUB_BATCH_SIZE: 500
        ASSETS_TRACKER_PROCESSOR: true
        ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: xyk_pool__batch_proc_5
        PERSIST_HIST_DATA_ONLY_ON_CHANGE: true
  api:
    env:
      GQL_PORT: 8080
      NODE_ENV: production
      SUB_PROCESSORS_RANGES: 'xyk_pool__batch_proc_1:3934550:4748000;xyk_pool__batch_proc_2:4748001:5561000;xyk_pool__batch_proc_3:5561001:6374000;xyk_pool__batch_proc_4:6374001:7187000;xyk_pool__batch_proc_5:7187001:-1'
    cmd:
      - sqd
      - api:prod
scale:
  dedicated: false
  addons:
    postgres:
      profile: medium
      storage: 5G
  processor:
    profile: medium
  api:
    profile: small
#    replicas: 2
