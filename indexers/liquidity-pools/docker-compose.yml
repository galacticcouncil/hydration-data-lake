version: "3"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: postgres
    shm_size: 1gb
    ports:
      - "${DB_PORT}:5432"
      # command: ["postgres", "-c", "log_statement=all"]
#    volumes:
#      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    environment:
      REDIS_ARGS: '--requirepass password'
    ports:
      - "6379:6379"
#    networks:
#      - epic_data_hub_dev