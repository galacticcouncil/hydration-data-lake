

manifestVersion: subsquid.io/v0.1
name: hydration-pools
slot: 808
description: Hydration pools indexer
build:
deploy:
  env:
    DEPLOYMENT_COMMIT_HASH: 'none'
    ORCHESTRATOR_QUEUE_REDIS_HOST: ${{ secrets.TS_REDIS_PROD_C_HOST }}
    ORCHESTRATOR_QUEUE_REDIS_PASS: ${{ secrets.TS_REDIS_PROD_C_PASS }}
    ORCHESTRATOR_QUEUE_REDIS_PORT: ${{ secrets.TS_REDIS_PROD_C_PORT }}
    TS_REDIS_HOST: ${{ secrets.TS_REDIS_PROD_C_HOST }}
    TS_REDIS_PASS: ${{ secrets.TS_REDIS_PROD_C_PASS }}
    TS_REDIS_PORT: ${{ secrets.TS_REDIS_PROD_C_PORT }}
  addons:
    postgres:
      config:
        statement_timeout: 30060000
        log_min_duration_statement: 60000
  processor:
    - name: core-proc
      env:
        REAGGREGATION_PROCESSING_MODE: false

        CHAIN: 'hydration'
        INDEXER_ID: 808
        RPC_URL: 'wss://node-owl-2.owl.shadow-senate.com'
        RPC_URL_HTTPS: 'https://node-owl-2.owl.shadow-senate.com'
        GATEWAY_HYDRATION_HTTPS: 'https://v2.archive.subsquid.io/network/hydradx'
        ASSET_HUB_RPC_URL: 'wss://rpc-asset-hub-polkadot.luckyfriday.io'
        #      ASSET_HUB_RPC_URL: 'wss://polkadot-asset-hub-rpc.polkadot.io'
        #      ASSET_HUB_RPC_URL: 'wss://statemint.public.curie.radiumblock.co/ws'
        TS_REDIS_KEY_SPACE_ID: 7
        MAX_JOB_BATCH_SIZE: 10

        NODE_ENV: 'production'
        OMNIPOOL_ADDRESS: '0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000'
        UNIFIED_EVENTS_GENESIS_SPEC_VERSION: 282
        INDEXING_IS_PAUSED: false
        ALL_IN_ONE_PROCESSOR_MODE: true
        IS_CORE_PROCESSOR: false
        IS_SPOT_PRICES_PROCESSOR: false
        PERSIST_HIST_DATA_ONLY_ON_CHANGE: true
        USE_XYKPOOLS_DATA_IN_TRADE_ROUTER: false
        HISTORICAL_DATA_PROCESSING_SUB_BATCH_SIZE: 20
        EVM_CONTRACT_CALL_RETRIES: 2
        ACCOUNT_BALANCES_REAGGREGATION_BATCH_SIZE: 10
        ACCOUNT_BALANCES_REAGGREGATION_MIN_PERIOD_BLOCKS: 7000
        ASYNC_OPERATIONS_CONCURRENCY_COMMON: 15
        EVM_CONTRACT_CALL_CONCURRENCY: 15
        RUNTIME_API_CALLS_CONCURRENCY: 15

        BALANCES_LOG_ENABLED: true

        ENABLE_CACHED_ROUTES_FOR_PRICE_CALCULATION: true

        COMMIT_HIST_DATA_TO_REDIS_TIME_SERIES: true
        ENABLE_REDIS_TS_UPDATE_COMMIT_DATA_COUNTER_ON_COMMIT: false

        ENSURE_PREFETCH_PERSISTENT_DATA_FOR_SPOT_PRICE: false

        PROCESS_FROM_BLOCK: 10430000
        PROCESS_TO_BLOCK: -1

        USE_STORAGE_DICTIONARY: true
        STORAGE_DICTIONARY_LBPPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:lbppool-v2/api/graphql'
        STORAGE_DICTIONARY_XYKPOOL_URL: 'https://storage-dict-xyk-hist-data-v2.orca.hydration.cloud/graphql'
        STORAGE_DICTIONARY_OMNIPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:omnipool-v2/api/graphql'
        STORAGE_DICTIONARY_STABLEPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:stablepool-v2/api/graphql'
        STORAGE_DICTIONARY_GEN_HIST_DATA_URL: 'https://storage-dict-generic-hist-data-v2.orca.hydration.cloud/graphql'
        STORAGE_DICTIONARY_ACCOUNT_HIST_DATA_URL: 'https://storage-dict-accounts-hist-data-v2.orca.hydration.cloud/graphql'
      cmd:
        - sqd
        - process:prod

    - name: vol-redis-committer
      env:
        REAGGREGATION_PROCESSING_MODE: true
        STATE_SCHEMA_NAME: 'vol-redis-committer-1'
        IS_CUSTOM_DB_MIGRATIONS_RUNNER: "false"
        REAGGREGATION_PROCESSING_FLOW_NAME: 'COMMIT_HISTORICAL_DATA_TO_REDIS'
        REAGGREGATION_PROCESSING_FLOW_TRIGGERS: 'COMMIT_ASSET_PAIR_VOLUMES_TO_REDIS'
        PROCESS_FROM_BLOCK: 11635000
        PROCESS_TO_BLOCK: 11635000
        COMMIT_HIST_DATA_TO_REDIS_TIME_SERIES: false
        TIME_SERIES_DATA_COMMIT_SUB_BATCH_MAX_SIZE: 3500
        TIME_SERIES_DATA_SCRAPPER_TIMEOUT_MS: 1000

        CHAIN: 'hydration'
        INDEXER_ID: 808
        RPC_URL: 'wss://node-owl-2.owl.shadow-senate.com'
        RPC_URL_HTTPS: 'https://node-owl-2.owl.shadow-senate.com'
        GATEWAY_HYDRATION_HTTPS: 'https://v2.archive.subsquid.io/network/hydradx'
        ASSET_HUB_RPC_URL: 'wss://rpc-asset-hub-polkadot.luckyfriday.io'
        #      ASSET_HUB_RPC_URL: 'wss://polkadot-asset-hub-rpc.polkadot.io'
        #      ASSET_HUB_RPC_URL: 'wss://statemint.public.curie.radiumblock.co/ws'
        TS_REDIS_KEY_SPACE_ID: 7
        MAX_JOB_BATCH_SIZE: 10

        NODE_ENV: 'production'
        OMNIPOOL_ADDRESS: '0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000'
        UNIFIED_EVENTS_GENESIS_SPEC_VERSION: 282
        INDEXING_IS_PAUSED: false
        ALL_IN_ONE_PROCESSOR_MODE: true
        IS_CORE_PROCESSOR: false
        IS_SPOT_PRICES_PROCESSOR: false
        PERSIST_HIST_DATA_ONLY_ON_CHANGE: true
        USE_XYKPOOLS_DATA_IN_TRADE_ROUTER: false
        HISTORICAL_DATA_PROCESSING_SUB_BATCH_SIZE: 20
        EVM_CONTRACT_CALL_RETRIES: 2
        ACCOUNT_BALANCES_REAGGREGATION_BATCH_SIZE: 10
        ACCOUNT_BALANCES_REAGGREGATION_MIN_PERIOD_BLOCKS: 7000
        ASYNC_OPERATIONS_CONCURRENCY_COMMON: 15
        EVM_CONTRACT_CALL_CONCURRENCY: 15
        RUNTIME_API_CALLS_CONCURRENCY: 15

        BALANCES_LOG_ENABLED: true

        ENABLE_CACHED_ROUTES_FOR_PRICE_CALCULATION: true

        ENABLE_REDIS_TS_UPDATE_COMMIT_DATA_COUNTER_ON_COMMIT: false

        ENSURE_PREFETCH_PERSISTENT_DATA_FOR_SPOT_PRICE: false

        USE_STORAGE_DICTIONARY: true
        STORAGE_DICTIONARY_LBPPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:lbppool-v2/api/graphql'
        STORAGE_DICTIONARY_XYKPOOL_URL: 'https://storage-dict-xyk-hist-data-v2.orca.hydration.cloud/graphql'
        STORAGE_DICTIONARY_OMNIPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:omnipool-v2/api/graphql'
        STORAGE_DICTIONARY_STABLEPOOL_URL: 'https://galacticcouncil.squids.live/hydration-storage-dictionary:stablepool-v2/api/graphql'
        STORAGE_DICTIONARY_GEN_HIST_DATA_URL: 'https://storage-dict-generic-hist-data-v2.orca.hydration.cloud/graphql'
        STORAGE_DICTIONARY_ACCOUNT_HIST_DATA_URL: 'https://storage-dict-accounts-hist-data-v2.orca.hydration.cloud/graphql'
      cmd:
        - sqd
        - process:prod



  api:
    env:
      NODE_ENV: 'production'
      CHAIN: 'hydration'
      GQL_PORT: 8080
      INDEXER_ID: 808
      INDEXER_VERSION: 'sqd-808'
      IS_MASTER_INSTANCE: false
      TS_REDIS_KEY_SPACE_ID: 7
      SUBSCAN_PRO_API_SECRET: ${{ secrets.SUBSCAN_PRO_API_SECRET }}
      SUBSCAN_PROXY_API_CORS_ALLOWED_SUFFIXES: 'hydration.net::-hydra-app.netlify.app::-hydration.netlify.app'
      SUBSCAN_PROXY_API_CORS_ALLOW_LOCALHOST: true
      RPC_URL: 'wss://node-orca-2.orca.hydration.cloud'
      RPC_URL_HTTPS: 'https://node-orca-2.orca.hydration.cloud'
      COMMIT_HIST_DATA_TO_REDIS_TIME_SERIES: false
      TIME_SERIES_DATA_COMMIT_SUB_BATCH_MAX_SIZE: 4500
      ASSET_HIST_DATA_TS_PULLING_BATCH_SIZE: 1500
      TIME_SERIES_DATA_SCRAPPER_TIMEOUT_MS: 1000

      DB_POOL_MAX_SIZE: 1

    cmd:
      - sqd
      - api:prod
scale:
  dedicated: true
  addons:
    postgres:
      profile: large
      storage: 480G
  processor:
    profile: xlarge
  api:
    profile: xlarge

