# ======================================================================================================================
# *** Asset ***
# ======================================================================================================================

enum AssetType {
  Bond
  External
  StableSwap
  Token
  XYK
  Erc20
  PoolShare
}
enum ResourceType {
  Underlying
  Collateral
  Debt
}

type Asset @entity {
  "assetRegistry ID or actual contract EVM address (e.g. 0xc64980e4eaf9a1151bd21712b9946b81e41e2b92 || 10)"
  id: ID!
  "Hydration AssetRegistry ID"
  assetRegistryId: String
  "real EVM contract address"
  evmAddress: String
  "list of all asset ids from current and other chains related with this Asset"
  multiLocationIds: [String]
  "list of all asset multi-locations from current and other chains related with this Asset"
  multiLocationsMetadata: [AssetMultiLocation]

  underlyingAsset: Asset
  aToken: Asset
  variableDebtToken: Asset

  assetType: AssetType!
  resourceType: ResourceType!
  name: String
  symbol: String
  decimals: Int
  xcmRateLimit: BigInt
  isSufficient: Boolean!
  existentialDeposit: BigInt!

  # note: existentialDeposit is probably taken 1:1 from the runtime,
  # real existential deposit will be calculated realtime based on the current price
}

enum AssetMultiLocationsInteriorKind {
  AccountId32
  AccountIndex64
  AccountKey20
  GeneralIndex
  GeneralKey
  GlobalConsensus
  OnlyChild
  PalletInstance
  Parachain
  Plurality
}

type AssetMultiLocationsInterior {
  kind: AssetMultiLocationsInteriorKind!
  network: String
  id: String
  index: String
  key: String
  value: String
  data: String
  part: String
  nom: String
  denom: String
  count: String
  blockNumber: String
  blockHash: String
  chainId: String
}

type AssetMultiLocation {
  parents: Int!
  "Here | X1 | X2 | X3 | X4 | X5 | X6 | X7 | X8"
  hierarchyLevel: String!
  interior: [AssetMultiLocationsInterior!]!
}

