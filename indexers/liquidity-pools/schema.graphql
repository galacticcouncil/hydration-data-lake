#
# BatchLbppoolHistVolsList is a support entity for the LbppoolVolumeHistoricalData API subscription.
# It contains all LBP pool IDs involved in volume aggregations (LbppoolVolumeHistoricalData)
# within a single indexer blocks batch, which may consist of one or more blocks. Since the processor saves all
# processed data from a batch of blocks in a single database transaction, this entity may include IDs from multiple
# blocks. This approach ensures that the subscription event is triggered only after all volume entities in the batch
# are saved, rather than after each individual volume aggregation, optimizing event handling and consistency.
#
type BatchLbppoolHistVolsList @entity {
  "<batchStartParaBlockHeight> (e.g. 101312)"
  id: ID!
  poolIds: [String!]

  batchStartParaBlockHeight: Int! @index
  batchEndParaBlockHeight: Int! @index
}

