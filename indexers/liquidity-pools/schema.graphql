  assetBBalance: BigInt!
  ownerId: String!
  feeCollectorId: String
  startBlockNumber: Int
  endBlockNumber: Int
  initialWeight: Int!
  finalWeight: Int!
  repayTarget: BigInt!
  weightCurve: String!
  fee: [Int!]!

  tvlInRefAssetNorm: String

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  blockId: String
}

