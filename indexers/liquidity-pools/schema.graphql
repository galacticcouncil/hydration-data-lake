# ======================================================================================================================
# *** Swapped - Unified Trade event ***
# ======================================================================================================================
enum SwapAssetBalanceType {
  Input
  Output
}

enum SwapFeeDestinationType {
  Account
  Burned
}

enum SwapFillerType {
  Omnipool
  Stableswap
  XYK
  LBP
  OTC
  Aave
}

enum TradeOperationType {
  ExactIn
  ExactOut
  ExactLimitIn
  ExactLimitOut
  LiquidityAdd
  LiquidityRemove
}

type SwapFee @entity {
  "<swapId>-<assetId>-<recipientId || destinationType> e.g. 0006516718-9965d-000107-0"
  id: ID!
  swap: Swap!
  asset: Asset!
  amount: BigInt!
  destinationType: SwapFeeDestinationType!
  recipient: Account
}

type SwapAssetBalance @entity {
  "<swapId>-<assetId>-<SwapAssetBalanceType> e.g. 0006516718-9965d-000107-0-INPUT"
  id: ID!
  swap: Swap!
  assetBalanceType: SwapAssetBalanceType!
  asset: Asset!
  amount: BigInt!
}

type Swap @entity {
  "<eventId> (e.g. 0006516718-9965d-000107)"
  id: ID!
  operationId: String
  traceIds: [String!]
  swapIndex: Int

  swapper: Account!
  filler: Account!
  fillerType: SwapFillerType!
  operationType: TradeOperationType!

  inputs: [SwapAssetBalance!]! @derivedFrom(field: "swap")
  outputs: [SwapAssetBalance!]! @derivedFrom(field: "swap")
  fees: [SwapFee!]! @derivedFrom(field: "swap")

  "List of all asset IDs involved in the swap, including those used for fees."
  allInvolvedAssetIds: [String!]!

  dcaScheduleExecutionEvent: DcaScheduleExecutionEvent
  otcOrderFulfillment: OtcOrderEvent
  routedTrade: RoutedTrade

  paraTimestamp: DateTime! @index
  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

type RoutedTradeAssetBalance @entity {
  "<routeTradeId>-<assetId>-<SwapAssetBalanceType> e.g. 6516718-3094-0-INPUT"
  id: ID!
  routedTrade: RoutedTrade!
  assetBalanceType: SwapAssetBalanceType!
  asset: Asset!
  amount: BigInt!
}

type RoutedTrade @entity {
  "<blockHeight>-<routerIncrementalId || swapId> (e.g. 6516718-3094 || 6516718-0006516718-9965d-000107)"
  id: ID!
  routeId: String
  inputs: [RoutedTradeAssetBalance] @derivedFrom(field: "routedTrade")
  outputs: [RoutedTradeAssetBalance] @derivedFrom(field: "routedTrade")
  allInvolvedAssetIds: [String!]!
  participantSwappers: [String!]!
  participantFillers: [String!]!
  feeRecipients: [String!]!
  swaps: [Swap!]! @derivedFrom(field: "routedTrade")

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  block: Block!
}

