  index: String
  key: String
  value: String
  valueJson: JSON
  data: String
  part: String
  nom: String
  denom: String
  count: String
  blockNumber: String
  blockHash: String
  chainId: String
}

type AssetMultiLocation {
  parents: Int!
  "Here | X1 | X2 | X3 | X4 | X5 | X6 | X7 | X8"
  hierarchyLevel: String!
  interior: [AssetMultiLocationsInterior!]!
}

