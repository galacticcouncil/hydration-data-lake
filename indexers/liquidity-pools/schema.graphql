# ======================================================================================================================
# *** NFT ***
# ======================================================================================================================

type NftCollection @entity {
  "collection ID "
  id: ID!
  collectionType: String! # must be reviewed
  owner: Account!
  issuer: Account!
  admin: Account!
  freezer: Account!
  totalDeposit: BigInt!
  freeHolding: Boolean!
  isFrozen: Boolean!
  items: Int!
  itemMetadatas: Int!
  attributes: Int!
  maxSupply: BigInt
}

type NftAsset @entity {
  "collection ID "
  id: ID!
  owner: Account!
  deposit: BigInt!
  isFrozen: Boolean!
}

# ======================================================================================================================
# *** Liquidity Providing and Farming ***
# ======================================================================================================================

#   --------------------------------------------------------------------------------------------------------------------
#       Farm generics
#   --------------------------------------------------------------------------------------------------------------------

enum FarmLifeStateEventName {
  GlobalFarmCreated
  GlobalFarmUpdated
  GlobalFarmTerminated
  YieldFarmCreated
  YieldFarmUpdated
  YieldFarmStopped
  YieldFarmResumed
  YieldFarmTerminated
}

type FarmLifeState {
  eventName: FarmLifeStateEventName!
  eventId: String
  paraBlockHeight: Int!
  relayBlockHeight: Int!
}

enum YieldFarmDepositStatus {
  SharesDeposited # probably can be renamed to DepositCreated
  DepositDestroyed
  SharesRedeposited
  SharesWithdrawn
  RewardClaimed
}

enum FarmState {
  Active
  Stopped
  Terminated
}

type YieldFarmLoyaltyCurve {
  initialRewardPercentage: String!
  scaleCoef: Int!
}

#   --------------------------------------------------------------------------------------------------------------------
#       Omnipool Liquidity Position
#   --------------------------------------------------------------------------------------------------------------------

enum OmnipoolLiquidityPositionStatus {
  PositionCreated
  PositionUpdated
  PositionDestroyed
  PositionLiquidityAdded
  PositionLiquidityRemoved
}

type OmnipoolLiquidityPositionEvent @entity {
  "event ID"
  id: ID!
  position: OmnipoolLiquidityPosition!
  eventName: OmnipoolLiquidityPositionStatus!

  account: Account
  asset: Asset
  amount: BigInt
  sharesAmount: BigInt
  price: BigInt
  fee: BigInt

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

type OmnipoolLiquidityPosition @entity {
  "position ID"
  id: ID!
  account: Account!
  asset: Asset!
  omnipoolAsset: OmnipoolAsset!
  initialAmount: BigInt!
  amount: BigInt!
  sharesAmount: BigInt!
  positionNft: NftAsset!

  "should be either PositionCreated or PositionDestroyed"
  status: OmnipoolLiquidityPositionStatus!

  positionEvents: [OmnipoolLiquidityPositionEvent]!
    @derivedFrom(field: "position")

  #  Point of time of position creation for better sorting
  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

#   --------------------------------------------------------------------------------------------------------------------
#       Omnipool Liquidity Farm
#   --------------------------------------------------------------------------------------------------------------------

type OmnipoolGlobalFarm @entity {
  "omnipool global farm ID "
  id: ID!
  owner: Account!

  updatedAtRelayBlock: Int!
  totalSharesZ: BigInt!
  accumulatedRpz: BigInt!
  rewardAsset: Asset!
  pendingRewards: BigInt!
  accumulatedPaidRewards: BigInt!
  yieldPerPeriod: BigInt!
  plannedYieldingPeriods: Int!
  blocksPerPeriod: Int!
  incentivizedAsset: Asset!
  maxRewardPerPeriod: Int!
  minDeposit: BigInt!
  liveYieldFarmsCount: Int!
  totalYieldFarmsCount: Int!
  priceAdjustment: BigInt!
  state: FarmState!
  lrnaPriceAdjustment: BigInt!
  totalRewards: BigInt!

  yieldFarms: [OmnipoolYieldFarm] @derivedFrom(field: "globalFarm")

  lifeStates: [FarmLifeState!]!
  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

type OmnipoolYieldFarm @entity {
  "global farm ID"
  id: ID!
  globalFarm: OmnipoolGlobalFarm!
  asset: Asset!
  updatedAtRelayBlock: Int!
  totalShares: BigInt!
  totalValuedShares: BigInt!
  accumulatedRpvs: BigInt!
  accumulatedRpz: BigInt!
  multiplier: BigInt!
  state: FarmState!
  entriesCount: Int!
  leftToDistribute: BigInt!
  totalStopped: BigInt!
  loyaltyCurve: YieldFarmLoyaltyCurve

  lifeStates: [FarmLifeState!]!
  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event
}

#   --------------------------------------------------------------------------------------------------------------------
#       Omnipool Liquidity Farm Deposit
#   --------------------------------------------------------------------------------------------------------------------

type OmnipoolYieldFarmDeposit @entity {
  "deposit ID"
  id: ID!
  depositNft: NftAsset!
  globalFarm: OmnipoolGlobalFarm!
  yieldFarm: OmnipoolYieldFarm!
  position: OmnipoolLiquidityPosition!
  account: Account!
  asset: Asset!

  "should be either SharesDeposited or DepositDestroyed"
  status: YieldFarmDepositStatus!
  sharesAmount: BigInt!
  entries: [OmnipoolYieldFarmEntry!]! @derivedFrom(field: "deposit")
  depositEvents: [OmnipoolYieldFarmDepositEvent]! @derivedFrom(field: "deposit")

  #  Point of time of position creation for better sorting
  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

type OmnipoolYieldFarmEntry @entity {
  "<deposit_id>-<omnipool_global_farm_id>-<omnipool_yield_farm_id>"
  id: ID!
  deposit: OmnipoolYieldFarmDeposit!
  valuedShares: BigInt!
  accumulatedRpvs: BigInt!
  accumulatedClaimedRewards: BigInt!
  enteredAtRelayBlock: Int!
  updatedAtRelayBlock: Int!
  stoppedAtCreation: Int!
}

type OmnipoolYieldFarmDepositEvent @entity {
  "event_id"
  id: ID!
  deposit: OmnipoolYieldFarmDeposit!
  eventName: YieldFarmDepositStatus!

  # required for SharesDeposited, SharesRedeposited, RewardClaimed events
  globalFarm: OmnipoolGlobalFarm!
  yieldFarm: OmnipoolYieldFarm!

  asset: Asset
  account: Account
  position: OmnipoolLiquidityPosition
  sharesAmount: BigInt
  claimedAmount: BigInt
  rewardAsset: Asset

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  event: Event!
}

