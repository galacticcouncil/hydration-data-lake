  assetAVolumeIn: BigInt!
  assetAVolumeOut: BigInt!
  assetATotalVolumeIn: BigInt!
  assetATotalVolumeOut: BigInt!
  assetAFee: BigInt!
  assetBFee: BigInt!
  assetATotalFees: BigInt!
  assetBTotalFees: BigInt!
  assetBVolumeIn: BigInt!
  assetBVolumeOut: BigInt!
  assetBTotalVolumeIn: BigInt!
  assetBTotalVolumeOut: BigInt!

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  block: Block!
}

#
# BatchLbppoolHistVolsList is a support entity for the LbppoolHistoricalVolume API subscription.
# It contains all LBP pool IDs involved in volume aggregations (LbppoolHistoricalVolume)
# within a single indexer blocks batch, which may consist of one or more blocks. Since the processor saves all
# processed data from a batch of blocks in a single database transaction, this entity may include IDs from multiple
# blocks. This approach ensures that the subscription event is triggered only after all volume entities in the batch
# are saved, rather than after each individual volume aggregation, optimizing event handling and consistency.
#
type BatchLbppoolHistVolsList @entity {
  "<batchStartParaBlockHeight> (e.g. 101312)"
  id: ID!
  poolIds: [String!]

  batchStartParaBlockHeight: Int! @index
  batchEndParaBlockHeight: Int! @index
}

type LbppoolHistoricalData @entity {
  "poolAddress-assetId-paraBlockHeight"
  id: ID!
  pool: Lbppool!

  assetA: Asset!
  assetB: Asset!
  assetABalance: BigInt!
  assetBBalance: BigInt!
  owner: Account!
  feeCollector: Account
  startBlockNumber: Int
  endBlockNumber: Int
  initialWeight: Int!
  finalWeight: Int!
  fee: [Int!]!
  repayTarget: BigInt!
  weightCurve: String!

  paraBlockHeight: Int! @index
  relayBlockHeight: Int!
  block: Block!
}

