version: "3.7"

x-chain-name: &chain-name "hydration"

x-storage-dictionary-xyk-db-creds: &storage-dictionary-xyk-db-creds
  DB_PORT: 5432
  DB_NAME: ""
  DB_USER: ""
  DB_PASS: ""
  DB_HOST: ""

x-processor-unit-envs: &processor-unit-envs
  NODE_ENV: "self-hosted"
  CHAIN: *chain-name
  RPC_URL: "wss://node.kril.hydration.cloud"
  IGNORE_ARCHIVE_DATA_SOURCE: "false"
  GATEWAY_HYDRATION_HTTPS: "https://v2.archive.subsquid.io/network/hydradx"
  OMNIPOOL_ADDRESS: "0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000"
  PROCESS_LBP_POOLS: "false"
  PROCESS_XYK_POOLS: "false"
  PROCESS_OMNIPOOLS: "false"
  PROCESS_STABLEPOOLS: "false"
  PROCESS_GENERIC_HIST_DATA: "false"
  PROCESS_ACCOUNTS: "false"
  INDEXER_MAX_SUB_BATCH_SIZE: 200
  SUB_BATCH_MAX_TIMEOUT_MS: 500
  INDEXER_SUB_PROCESSORS_NUMBER: 5
  ASSETS_TRACKER_PROCESSOR: "false"
  PERSIST_HIST_DATA_ONLY_ON_CHANGE: "true"

x-common-db-setup: &common-db-setup
  image: postgres:15
  networks:
    - default
  deploy:
    restart_policy:
      condition: on-failure

x-common-processor-setup: &common-processor-setup
  image: ghcr.io/mckrava/storage-dictionary-indexer:e8f6106a76712e0e0e461ebd1c126dbbd9c21096
  networks:
    - default
  command:
    - sh
    - -c
    - "sqd migration:apply && node lib/main.js"
  deploy:
    restart_policy:
      condition: on-failure

# =================================================================================
# ========================== XYK SERVICES SETUP ===========================
# =================================================================================
x-lbp-services-setup: &lbp-services-setup
  lbp-stor-dict-proc-1:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-xyk-db-creds]
      PROCESS_FROM_BLOCK: 3681428
      PROCESS_TO_BLOCK: 4512000
      PROCESS_LBP_POOLS: "true"
      STATE_SCHEMA_NAME: "lbp_pool__batch_proc_1"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"

  lbp-stor-dict-proc-2:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-xyk-db-creds]
      PROCESS_FROM_BLOCK: 4512001
      PROCESS_TO_BLOCK: 5384000
      PROCESS_LBP_POOLS: "true"
      STATE_SCHEMA_NAME: "lbp_pool__batch_proc_2"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"

  lbp-stor-dict-proc-3:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-xyk-db-creds]
      PROCESS_FROM_BLOCK: 5384001
      PROCESS_TO_BLOCK: 6256000
      PROCESS_LBP_POOLS: "true"
      STATE_SCHEMA_NAME: "lbp_pool__batch_proc_3"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"

  lbp-stor-dict-proc-4:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-xyk-db-creds]
      PROCESS_FROM_BLOCK: 6256001
      PROCESS_TO_BLOCK: 7128000
      PROCESS_LBP_POOLS: "true"
      STATE_SCHEMA_NAME: "lbp_pool__batch_proc_4"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"

  lbp-stor-dict-proc-5:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-xyk-db-creds]
      PROCESS_FROM_BLOCK: 7128001
      PROCESS_TO_BLOCK: -1
      PROCESS_LBP_POOLS: "true"
      STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"
      ASSETS_TRACKER_PROCESSOR: "true"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "lbp_pool__batch_proc_5"

