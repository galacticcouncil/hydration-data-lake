version: "3.7"

# ======================================================================================================================
# =============================================== V A R I A B L E S ====================================================
# ======================================================================================================================

x-chain-name: &chain-name "hydration"

x-aggregator-pg-db: &aggregator-pg-db "aggregator_indexer"
x-aggregator-pg-user: &aggregator-pg-user "postgres"
x-aggregator-pg-password: &aggregator-pg-password "postgres"
x-aggregator-pg-host: &aggregator-pg-host "db-aggregator-pgbouncer"

x-ts-redis-host: &ts-redis-host "db-ts-redis"
x-ts-redis-pass: &ts-redis-pass "password"
x-ts-redis-port: &ts-redis-port 6379

x-aggregator-indexer-id: &aggregator-indexer-id "swarm_1"

x-gateway-hydration-url: &gateway-hydration-url "https://v2.archive.subsquid.io/network/hydradx"

x-aggregator-rpc-url-wss: &aggregator-rpc-url-wss "wss://node-subwhale-9.shellfish.hydration.cloud"
x-aggregator-rpc-url-https: &aggregator-rpc-url-https "https://node-subwhale-9.shellfish.hydration.cloud"

x-aggregator-indexer-image: &aggregator-indexer-image "ghcr.io/mckrava/liquidity-pools-indexer:33600f29998c3a35d48a4ed16bad7959c2b4d16d"

# ======================================================================================================================
# ======================================== C O N F I G   S E G M E N T S ===============================================
# ======================================================================================================================

x-db-ts-redis-creds: &db-ts-redis-creds
  TS_REDIS_HOST: *ts-redis-host
  TS_REDIS_PORT: *ts-redis-port
  TS_REDIS_PASS: *ts-redis-pass
  TS_REDIS_KEY_SPACE_ID: 5

# ------------------------------------ A G G R E G A T I O N   I N D E X E R -------------------------------------------

x-db-aggregator-creds: &db-aggregator-creds
  DB_PORT: 5432
  DB_NAME: *aggregator-pg-db
  DB_USER: *aggregator-pg-user
  DB_PASS: *aggregator-pg-password
  DB_HOST: *aggregator-pg-host

x-aggregator-proc-default-envs: &aggregator-proc-default-envs
  INDEXER_ID: *aggregator-indexer-id
  NODE_OPTIONS: "--max-old-space-size=8048"
  NODE_ENV: "self-hosted"
  CHAIN: *chain-name
  RPC_URL: *aggregator-rpc-url-wss
  RPC_URL_HTTPS: *aggregator-rpc-url-https

  # Set IGNORE_ARCHIVE_DATA_SOURCE to true if indexer has to work without SQD archive.
  IGNORE_ARCHIVE_DATA_SOURCE: "false"
  GATEWAY_HYDRATION_HTTPS: *gateway-hydration-url

  OMNIPOOL_ADDRESS: "0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000"
  HSMPOOL_ADDRESS: "0x6d6f646c70792f68736d6f640000000000000000000000000000000000000000"
  HOLLAR_CONTRACT_ADDRESS: "0x531a654d1696ed52e7275a8cede955e82620f99a"

  MAX_JOB_BATCH_SIZE: 20
  HISTORICAL_DATA_PROCESSING_SUB_BATCH_SIZE: 10

  PERSIST_HIST_DATA_ONLY_ON_CHANGE: "true"
  UNIFIED_EVENTS_GENESIS_SPEC_VERSION: 282
  INDEXING_IS_PAUSED: "false"
  # If USE_STORAGE_DICTIONARY == false, STORAGE_DICTIONARY_..._URLs can be omitted.
  USE_STORAGE_DICTIONARY: "true"
  # In cases where the Storage Dictionary indexer uses a single instance for all pool types,
  # you must provide the same API URL to all STORAGE_DICTIONARY_..._URL parameters.
  # For example, if the Storage Dictionary is running as a single processor indexer
  # within the same Swarm stack as the Liquidity Pools indexer,
  # the URL for all pools should be set uniformly, such as:
  #   http://storage-dictionary-api:8090/graphql

  STORAGE_DICTIONARY_LBPPOOL_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:lbppool-v2/api/graphql"
  STORAGE_DICTIONARY_XYKPOOL_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:xykpool-v2/api/graphql"
  STORAGE_DICTIONARY_OMNIPOOL_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:omnipool-v2/api/graphql"
  STORAGE_DICTIONARY_STABLEPOOL_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:stablepool-v2/api/graphql"
  STORAGE_DICTIONARY_GEN_HIST_DATA_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:generic-data-v2/api/graphql"
  STORAGE_DICTIONARY_ACCOUNT_HIST_DATA_URL: "https://galacticcouncil.squids.live/hydration-storage-dictionary:account-data-v2/api/graphql"

x-aggregator-proc-default-config: &aggregator-proc-default-config
  image: *aggregator-indexer-image
  networks:
    - default
  command:
    - sh
    - -c
    - "sqd migration:apply && node lib/main.js"
  deploy:
    restart_policy:
      condition: on-failure

# ======================================================================================================================
# ============================================ S T A C K   C O N F I G =================================================
# ======================================================================================================================

networks:
  default:
    driver: overlay

volumes:
  db-aggregator-indexer:
    driver: local
  db-ts-redis:
    driver: local

services:
  # ------------------------------------ A G G R E G A T I O N   I N D E X E R -------------------------------------------
  db-ts-redis:
    image: redis/redis-stack:latest
    command:
      - sh
      - -c
      - |
        redis-stack-server \
        --requirepass password
    ports:
      - "6394:6379"
    volumes:
      - "db-ts-redis:/var/lib/redis/data"
    networks:
      - default
    logging:
      driver: json-file

  db-aggregator-indexer:
    image: postgres:15
    environment:
      POSTGRES_DB: *aggregator-pg-db
      POSTGRES_USER: *aggregator-pg-user
      POSTGRES_PASSWORD: *aggregator-pg-password
    command:
      - "postgres"
      - "-c"
      - "statement_timeout=3000000"
      - "-c"
      - "tcp_keepalives_idle=600"
      - "-c"
      - "tcp_keepalives_interval=30"
      - "-c"
      - "tcp_keepalives_count=3"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "idle_in_transaction_session_timeout=1800000"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d_%H%M%S.log"
      - "-c"
      - "log_rotation_age=1d"
      - "-c"
      - "log_rotation_size=100MB"
      - "-c"
      - "log_line_prefix=%t [%p]: [ %l-1 ] user=%u,db=%d,app=%a,client=%h"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
    volumes:
      - "db-aggregator-indexer:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aggregator_indexer"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
    networks:
      - default

    deploy:
      restart_policy:
        condition: on-failure

  db-aggregator-pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db-aggregator-indexer
      DB_PORT: 5432
      DB_USER: *aggregator-pg-user
      DB_PASSWORD: *aggregator-pg-password
      DB_DBNAME: *aggregator-pg-db
      AUTH_TYPE: scram-sha-256
      DNS_MAX_TTL: 15
      DNS_NXDOMAIN_TTL: 15
      PGBOUNCER_LISTEN_PORT: 5433
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 2400
    ports:
      - "5494:5432"
    depends_on:
      - db-aggregator-indexer
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      restart_policy:
        condition: on-failure

  aggregator-processor:
    <<: *aggregator-proc-default-config
    depends_on:
      - db-aggregator-pgbouncer
    environment:
      <<:
        [
          *db-aggregator-creds,
          *db-ts-redis-creds,
          *aggregator-proc-default-envs,
        ]
      SIMPLIFIED_PROCESSING: "true"
      PROCESS_FROM_BLOCK: 8000000
      PROCESS_TO_BLOCK: -1
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 15
        window: 300s

  aggregator-api:
    image: *aggregator-indexer-image
    depends_on:
      - db-aggregator-pgbouncer
    environment:
      <<: [*db-aggregator-creds, *db-ts-redis-creds]
      INDEXER_ID: *aggregator-indexer-id
      NODE_ENV: "self-hosted"
      CHAIN: *chain-name
      GQL_PORT: 8080
      SUB_PROCESSOR_SCHEMAS: "core_processor"
    ports:
      - "8094:8080"
    networks:
      - default
    logging:
      driver: json-file
    command:
      - sh
      - -c
      - "sqd api:prod"
    deploy:
      restart_policy:
        condition: on-failure
