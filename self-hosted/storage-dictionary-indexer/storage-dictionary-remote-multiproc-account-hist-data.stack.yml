version: "3.7"

x-chain-name: &chain-name "hydration"

x-storage-dictionary-g-hist-db-creds: &storage-dictionary-g-hist-db-creds
  DB_PORT: 5432
  DB_NAME: ""
  DB_USER: ""
  DB_PASS: ""
  DB_HOST: ""

x-processor-unit-envs: &processor-unit-envs
  NODE_ENV: "self-hosted"
  CHAIN: *chain-name
  RPC_URL: "wss://node.kril.hydration.cloud"
  RPC_URL_HTTPS: "https://node.kril.hydration.cloud"
  IGNORE_ARCHIVE_DATA_SOURCE: "false"
  GATEWAY_HYDRATION_HTTPS: "https://v2.archive.subsquid.io/network/hydradx"
  OMNIPOOL_ADDRESS: "0x6d6f646c6f6d6e69706f6f6c0000000000000000000000000000000000000000"
  PROCESS_LBP_POOLS: "false"
  PROCESS_XYK_POOLS: "false"
  PROCESS_OMNIPOOLS: "false"
  PROCESS_STABLEPOOLS: "false"
  PROCESS_GENERIC_HIST_DATA: "false"
  PROCESS_ACCOUNTS: "false"
  INDEXER_MAX_SUB_BATCH_SIZE: 500
  SUB_BATCH_MAX_TIMEOUT_MS: 500
  INDEXER_SUB_PROCESSORS_NUMBER: 8
  RUNTIME_API_CALLS_CONCURRENCY: 5
  ASSETS_TRACKER_PROCESSOR: "false"
  PERSIST_HIST_DATA_ONLY_ON_CHANGE: "true"
  INDEXING_IS_PAUSED: "false"

x-common-db-setup: &common-db-setup
  image: postgres:15
  networks:
    - default
  deploy:
    restart_policy:
      condition: on-failure

x-common-processor-setup: &common-processor-setup
  image: ghcr.io/mckrava/storage-dictionary-indexer:353c76d931e6f05cfc05642c19d4bdcce7eeaadd
  networks:
    - default
  command:
    - sh
    - -c
    - "sqd migration:apply && node lib/main.js"
  deploy:
    restart_policy:
      condition: on-failure

# =================================================================================
# ====================== GENERIC HIST DATA SERVICES SETUP =========================
# =================================================================================
x-g-hist-services-setup: &g-hist-services-setup
  g-hist-stor-dict-proc-1:
    <<: *common-processor-setup
    environment:
      <<: [*processor-unit-envs, *storage-dictionary-g-hist-db-creds]
      PROCESS_FROM_BLOCK: 1439857 # First event related with Omnipool has been occurred
      PROCESS_TO_BLOCK: 2752000
      PROCESS_ACCOUNTS: "true"
      STATE_SCHEMA_NAME: "acc_hist_data__batch_proc_1"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "acc_hist_data__batch_proc_8"
      INDEXING_IS_PAUSED: "true"

