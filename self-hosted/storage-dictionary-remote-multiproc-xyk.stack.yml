      PROCESS_FROM_BLOCK: 7187001
      PROCESS_TO_BLOCK: -1
      PROCESS_XYK_POOLS: "true"
      STATE_SCHEMA_NAME: "xyk_pool__batch_proc_5"
      ASSETS_TRACKER_PROCESSOR: "true"
      PROCESS_ONLY_MISSED_BLOCKS: "false"
      ASSETS_ACTUALISATION_PROC_STATE_SCHEMA_NAME: "xyk_pool__batch_proc_5"
